<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Info - アニメ情報検索</title>

    <!-- OGP / Twitter Cards -->
    <meta property="og:title" content="Anime Info - アニメ情報検索">
    <meta property="og:description" content="今期のアニメ曜日別番組表とお気に入り管理、過去作のグローバル検索ができるモダンなアニメファインダーアプリです。">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://az-iris.github.io/animeinfo/">
    <meta property="og:image" content="https://az-iris.github.io/animeinfo/ogp_banner.png">
    
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Anime Info - アニメ情報検索">
    <meta name="twitter:description" content="今期のアニメ曜日別番組表とお気に入り管理、過去作のグローバル検索ができるモダンなアニメファインダーアプリです。">
    <meta name="twitter:image" content="https://az-iris.github.io/animeinfo/ogp_banner.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #090a0f;
            --surface-1: rgba(255, 255, 255, 0.03);
            --surface-2: rgba(255, 255, 255, 0.06);
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-focus: rgba(99, 102, 241, 0.5);
            --accent-primary: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.25);
        }

        body {
            font-family: 'Plus Jakarta Sans', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-base);
            color: #f1f5f9;
            background-image: 
                radial-gradient(ellipse 80% 50% at 50% -10%, rgba(59, 130, 246, 0.12), transparent),
                radial-gradient(circle 600px at 80% 10%, rgba(99, 102, 241, 0.06), transparent);
            background-attachment: fixed;
            min-height: 100vh;
        }

        /* カスタムスクロールバー */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(9, 10, 15, 0.8);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        /* カードのマイクロインタラクション */
        .anime-card {
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), 
                        box-shadow 0.35s cubic-bezier(0.16, 1, 0.3, 1),
                        border-color 0.25s ease;
            will-change: transform;
        }

        .anime-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 35px -10px rgba(0, 0, 0, 0.7), 
                        0 0 25px -5px rgba(59, 130, 246, 0.15);
        }

        .anime-card.is-selected {
            border-color: rgba(59, 130, 246, 0.8) !important;
            box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.25), 
                        0 0 0 1px rgba(59, 130, 246, 0.4);
        }

        /* タイル表示カード */
        .anime-tile {
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s ease;
        }
        .anime-tile:hover {
            transform: scale(1.04);
            z-index: 20;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.8);
        }

        /* ローダースピナー */
        .loader-ring {
            border: 3px solid rgba(255, 255, 255, 0.08);
            border-top-color: #3b82f6;
            animation: spin 1s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 脈動パルスアニメーション */
        .live-dot {
            box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7);
            animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { box-shadow: 0 0 0 8px rgba(34, 197, 94, 0); }
            100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }

        /* セレクトボックスのオプション背景（OS・ブラウザの白背景化防止） */
        select option {
            background-color: #111420;
            color: #f1f5f9;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col antialiased selection:bg-blue-500 selection:text-white">

    <!-- グラスモーフィズム・ヘッダー -->
    <header class="sticky top-0 z-50 backdrop-blur-xl bg-[#090a0f]/80 border-b border-white/[0.08] transition-all">
        <div class="container mx-auto px-4 sm:px-6 h-20 flex justify-between items-center">
            
            <!-- ロゴ & アプリ概要 -->
            <div class="flex items-center gap-3.5">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 via-indigo-600 to-cyan-400 p-[1px] shadow-lg shadow-blue-500/20 flex items-center justify-center shrink-0">
                    <div class="w-full h-full bg-[#0d0f17] rounded-[11px] flex items-center justify-center">
                        <svg class="w-5 h-5 text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 4v16M17 4v16M3 8h4m10 0h4M3 12h18M3 16h4m10 0h4M4 20h16a1 1 0 001-1V5a1 1 0 00-1-1H4a1 1 0 00-1 1v14a1 1 0 001 1z" />
                        </svg>
                    </div>
                </div>
                <div>
                    <h1 class="text-xl sm:text-2xl font-extrabold tracking-tight text-white">
                        Anime Info

            <!-- ステータス・現在シーズンバッジ -->

                <div id="season-display" class="flex items-center gap-2.5 px-3.5 py-1.5 rounded-full bg-white/[0.04] border border-white/[0.08] backdrop-blur-md shadow-sm">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 live-dot"></span>

    </header>

    <main class="container mx-auto px-4 sm:px-6 py-8 flex-grow">
        
        <!-- シーズン選択ツールバー -->
        <div class="max-w-2xl mx-auto mb-8">
            <div class="flex flex-wrap items-center justify-center gap-3 p-2 rounded-2xl bg-white/[0.03] border border-white/[0.08] backdrop-blur-md shadow-inner">
                <div class="flex items-center gap-2 text-xs font-semibold text-slate-400 pl-2">
                    <svg class="w-4 h-4 text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                    </svg>
                    <span>シーズン:</span>
                </div>

                <div class="relative">
                    <select id="year-select" class="appearance-none bg-[#131620] hover:bg-[#1a1e2c] border border-white/[0.12] text-slate-100 text-xs sm:text-sm font-semibold rounded-xl pl-3.5 pr-8 py-2 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 cursor-pointer transition-colors">
                        <!-- JSで動的生成 -->

                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-2.5 text-slate-400">
                        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>

                    <select id="season-select" class="appearance-none bg-[#131620] hover:bg-[#1a1e2c] border border-white/[0.12] text-slate-100 text-xs sm:text-sm font-semibold rounded-xl pl-3.5 pr-8 py-2 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 cursor-pointer transition-colors">
                        <option value="WINTER">冬期 (1〜3月)</option>
                        <option value="SPRING">春期 (4〜6月)</option>

                        <option value="FALL">秋期 (10〜12月)</option>

                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-2.5 text-slate-400">
                        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>
                    </div>
                </div>
            </div>
        </div>

        <!-- 検索バー（作品検索タブ選択時に開く） -->
        <div id="search-bar-container" class="max-w-xl mx-auto mb-8 hidden transition-all">
            <div class="relative flex items-center">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">

                    </svg>
                </div>
                <input type="text" id="search-input" placeholder="作品名、声優、制作会社、キーワードで検索..." 
                       class="w-full pl-11 pr-24 py-3.5 bg-white/[0.04] border border-white/[0.12] rounded-2xl text-slate-100 placeholder-slate-500 text-sm focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 backdrop-blur-md transition-all shadow-inner">
                
                <div class="absolute right-2 flex items-center gap-1.5">
                    <button id="search-clear-btn" class="p-1.5 text-slate-400 hover:text-white rounded-lg transition-colors hidden" title="クリア">
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>
                    <button id="search-btn" class="px-4 py-2 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white text-xs font-semibold rounded-xl shadow-md shadow-blue-500/20 transition-all flex items-center gap-1">
                        検索
                    </button>
                </div>
            </div>
        </div>

        <!-- ナビゲーションタブ ＆ 表示切り替えコントロール -->
        <div class="flex flex-col md:flex-row items-center justify-between gap-4 mb-8">
            <div class="w-full flex-grow flex justify-center">
                <div id="day-tabs" class="inline-flex flex-wrap items-center justify-center gap-1 p-1 sm:p-1.5 rounded-2xl bg-white/[0.03] border border-white/[0.08] backdrop-blur-md shadow-sm">
                    <button class="day-tab-btn px-2.5 sm:px-3.5 py-1 sm:py-1.5 rounded-xl text-xs sm:text-sm font-semibold transition-all text-slate-400 hover:text-white hover:bg-white/[0.05]" data-day="all">すべて</button>
                    <button class="day-tab-btn px-2.5 sm:px-3.5 py-1 sm:py-1.5 rounded-xl text-xs sm:text-sm font-semibold transition-all text-slate-400 hover:text-white hover:bg-white/[0.05]" data-day="monday">月曜</button>
                    <button class="day-tab-btn px-2.5 sm:px-3.5 py-1 sm:py-1.5 rounded-xl text-xs sm:text-sm font-semibold transition-all text-slate-400 hover:text-white hover:bg-white/[0.05]" data-day="tuesday">火曜</button>
                    <button class="day-tab-btn px-2.5 sm:px-3.5 py-1 sm:py-1.5 rounded-xl text-xs sm:text-sm font-semibold transition-all text-slate-400 hover:text-white hover:bg-white/[0.05]" data-day="wednesday">水曜</button>
                    <button class="day-tab-btn px-2.5 sm:px-3.5 py-1 sm:py-1.5 rounded-xl text-xs sm:text-sm font-semibold transition-all text-slate-400 hover:text-white hover:bg-white/[0.05]" data-day="thursday">木曜</button>
                    <button class="day-tab-btn px-2.5 sm:px-3.5 py-1 sm:py-1.5 rounded-xl text-xs sm:text-sm font-semibold transition-all text-slate-400 hover:text-white hover:bg-white/[0.05]" data-day="friday">金曜</button>
                    <button class="day-tab-btn px-2.5 sm:px-3.5 py-1 sm:py-1.5 rounded-xl text-xs sm:text-sm font-semibold transition-all text-slate-400 hover:text-white hover:bg-white/[0.05]" data-day="saturday">土曜</button>
                    <button class="day-tab-btn px-2.5 sm:px-3.5 py-1 sm:py-1.5 rounded-xl text-xs sm:text-sm font-semibold transition-all text-slate-400 hover:text-white hover:bg-white/[0.05]" data-day="sunday">日曜</button>
                    <button class="day-tab-btn px-2.5 sm:px-3.5 py-1 sm:py-1.5 rounded-xl text-xs sm:text-sm font-semibold transition-all text-slate-400 hover:text-white hover:bg-white/[0.05]" data-day="other">他</button>
                    
                    <div class="h-4 w-[1px] bg-white/[0.1] mx-1 hidden sm:block"></div>
                    
                    <button class="day-tab-btn px-2.5 sm:px-3.5 py-1 sm:py-1.5 rounded-xl text-xs sm:text-sm font-semibold transition-all text-slate-400 hover:text-white hover:bg-white/[0.05] flex items-center gap-1 sm:gap-1.5" data-day="selected">
                        <span>📌 お気に入り</span>
                        <span id="fav-badge" class="hidden px-1.5 py-0.5 rounded-full text-[10px] font-bold bg-blue-500/20 text-blue-300 border border-blue-500/30">0</span>
                    </button>
                    <button class="day-tab-btn px-2.5 sm:px-3.5 py-1 sm:py-1.5 rounded-xl text-xs sm:text-sm font-semibold transition-all text-slate-400 hover:text-white hover:bg-white/[0.05] flex items-center gap-1 sm:gap-1.5" data-day="search">
                        <span>🔍 検索</span>
                    </button>
                </div>
            </div>

            <!-- タイル表示切り替えボタン -->
            <div class="flex items-center shrink-0 self-end md:self-auto">
                <button id="view-toggle-btn" class="p-2.5 rounded-xl bg-white/[0.04] hover:bg-white/[0.08] text-slate-400 hover:text-white border border-white/[0.08] transition-all flex items-center gap-2 text-xs font-semibold" title="表示切り替え（カード / タイル）">
                    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M4 4h6v6H4V4zm10 0h6v6h-6V4zM4 14h6v6H4v-6zm10 0h6v6h-6v-6z"/>
                    </svg>
                    <span class="hidden sm:inline">タイル表示</span>
                </button>
            </div>
        </div>

        <!-- ローダー -->
        <div id="loader-container" class="flex flex-col items-center justify-center py-28">
            <div class="loader-ring rounded-full h-12 w-12 mb-4"></div>
            <p class="text-sm font-medium text-slate-400 tracking-wide">アニメデータを取得中...</p>
        </div>

        <!-- アニメ一覧グリッド -->
        <div id="anime-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-3 sm:gap-6 hidden">
            <!-- カードがここに動的挿入されます -->
        </div>

        <!-- エラーメッセージ -->
        <div id="error-message" class="hidden text-center py-20">
            <!-- エラー内容 -->
        </div>
    </main>

    <!-- フッター -->
    <footer class="mt-20 border-t border-white/[0.06] bg-[#07080c]/60 py-10 backdrop-blur-md">
        <div class="container mx-auto px-4 text-center">
            <p class="text-xs text-slate-500 font-medium">
                データ連携: <a href="https://annict.com" target="_blank" class="text-slate-400 hover:text-blue-400 transition-colors font-semibold underline underline-offset-4 decoration-slate-700">Annict API</a>
            </p>
            <p class="text-[11px] text-slate-600 mt-2 font-normal">
                Anime Info © 2026. All anime information & covers are copyrighted to their respective owners.
            </p>
        </div>
    </footer>

    <script>
        let allAnimeList = [];
        let searchResultsList = [];
        let isSearchMode = false;
        let activeDay = 'monday';
        let isLoadComplete = false;
        let isTileView = false;
        
        // 選択されたアニメオブジェクトを保存する配列
        let selectedAnimeList = JSON.parse(localStorage.getItem('selected_anime_list') || '[]');
        // 選択されたアニメIDを保存するSet
        const selectedAnimeIds = new Set(selectedAnimeList.map(a => a.id));

        // 過去のselected_anime_idsデータ互換性
        const legacyIds = JSON.parse(localStorage.getItem('selected_anime_ids') || '[]');
        if (legacyIds.length > 0 && selectedAnimeList.length === 0) {
            legacyIds.forEach(id => selectedAnimeIds.add(id));
        }

        function updateFavBadge() {
            const badge = document.getElementById('fav-badge');
            if (!badge) return;
            const count = selectedAnimeIds.size;
            if (count > 0) {
                badge.textContent = count;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        function saveSelectedAnime() {
            localStorage.setItem('selected_anime_list', JSON.stringify(selectedAnimeList));
            localStorage.setItem('selected_anime_ids', JSON.stringify([...selectedAnimeIds]));
            updateFavBadge();
        }

        function toggleSelectAnime(anime) {
            if (selectedAnimeIds.has(anime.id)) {
                selectedAnimeIds.delete(anime.id);
                selectedAnimeList = selectedAnimeList.filter(a => a.id !== anime.id);
            } else {
                selectedAnimeIds.add(anime.id);
                if (!selectedAnimeList.some(a => a.id === anime.id)) {
                    selectedAnimeList.push(anime);
                }
            }
            saveSelectedAnime();
        }

        const daysMap = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
        
        // 今日の曜日を取得
        const todayIndex = new Date().getDay();
        activeDay = daysMap[todayIndex];

        // 今日の日付から現在のシーズン情報を算出する関数
        function getCurrentSeasonInfo() {
            const date = new Date();
            const year = date.getFullYear();
            const month = date.getMonth() + 1; // 1-12
            let season = 'SPRING';
            let label = `${year}年 春アニメ`;
            
            if (month >= 1 && month <= 3) {
                season = 'WINTER';
                label = `${year}年 冬アニメ`;
            } else if (month >= 4 && month <= 6) {
                season = 'SPRING';
                label = `${year}年 春アニメ`;
            } else if (month >= 7 && month <= 9) {
                season = 'SUMMER';
                label = `${year}年 夏アニメ`;
            } else if (month >= 10 && month <= 12) {
                season = 'FALL';
                label = `${year}年 秋アニメ`;
            }
            
            return {
                year: year,
                season: season,
                label: label
            };
        }

        // 選択されたセレクトボックスの値からシーズン情報を取得する関数
        function getSelectedSeasonInfo() {
            const yearSelect = document.getElementById('year-select');
            const seasonSelect = document.getElementById('season-select');
            
            const year = parseInt(yearSelect.value, 10);
            const season = seasonSelect.value;
            
            const seasonMap = {
                'WINTER': '冬アニメ',
                'SPRING': '春アニメ',
                'SUMMER': '夏アニメ',
                'FALL': '秋アニメ'
            };
            const label = `${year}年 ${seasonMap[season] || season}`;
            
            return {
                year: year,
                season: season,
                label: label
            };
        }

        // セレクトボックスのオプションを初期化する関数
        function populateSelectors() {
            const yearSelect = document.getElementById('year-select');
            const seasonSelect = document.getElementById('season-select');
            
            const currentYear = new Date().getFullYear();
            const startYear = 2010;
            
            yearSelect.innerHTML = '';
            for (let y = currentYear + 1; y >= startYear; y--) {
                const opt = document.createElement('option');
                opt.value = y;
                opt.textContent = `${y}年`;
                yearSelect.appendChild(opt);
            }
            
            const current = getCurrentSeasonInfo();
            yearSelect.value = current.year;
            seasonSelect.value = current.season;
        }

        // AniList Media オブジェクトをアプリ共通の Anime オブジェクト構造に変換する関数
        function mapAniListMediaToAnime(media) {
            const title = media.title.native || media.title.romaji || media.title.english;
            
            let releasedOn = '';
            if (media.startDate && media.startDate.year && media.startDate.month && media.startDate.day) {
                releasedOn = `${media.startDate.year}-${String(media.startDate.month).padStart(2, '0')}-${String(media.startDate.day).padStart(2, '0')}`;
            }

            // キャスト情報（メインキャスト）
            const casts = (media.characters.edges || []).map(edge => {
                const characterName = edge.node.name.native || edge.node.name.full;
                const voiceActor = edge.voiceActors && edge.voiceActors[0] 
                    ? (edge.voiceActors[0].name.native || edge.voiceActors[0].name.full) 
                    : '';
                return {
                    character: characterName,
                    actor: voiceActor
                };
            }).filter(c => c.character && c.actor);

            // 配信サービスの抽出
            const streamingLinks = {
                dAnimeStore: '',
                unext: '',
                amazon: '',
                netflix: '',
                abema: '',
                dmm: '',
                nico: ''
            };
            if (media.externalLinks) {
                media.externalLinks.forEach(link => {
                    const siteName = link.site.toLowerCase();
                    const url = link.url;
                    if (siteName.includes('danime') || siteName.includes('d anime') || url.includes('animestore.docomo')) {
                        streamingLinks.dAnimeStore = url;
                    } else if (siteName.includes('u-next') || url.includes('unext.jp')) {
                        streamingLinks.unext = url;
                    } else if (siteName.includes('amazon') || siteName.includes('prime video') || url.includes('amazon.co.jp') || url.includes('amazon.com')) {
                        streamingLinks.amazon = url;

            const translatedStudio = studioMapJa[lowerStudio] || animationStudio;

            const directors = [];
            const originalCreators = [];
            const scriptwriters = [];
            const composers = [];

            if (media.staff && media.staff.edges) {
                media.staff.edges.forEach(edge => {
                    const role = (edge.role || '').toLowerCase();
                    const staffName = edge.node.name.native || edge.node.name.full;
                    if (!staffName) return;

                    if (role === 'director' || role === 'series director' || role === 'chief director') {
                        directors.push(staffName);
                    } else if (role === 'original creator' || role === 'original story' || role === 'original character design' || role.includes('original creator') || role.includes('original story')) {

        // AniList GraphQL からデータを一括取得する関数
        async function loadAllAnimeData() {
            const grid = document.getElementById('anime-grid');
            const loader = document.getElementById('loader-container');
            const errorMsg = document.getElementById('error-message');
            const seasonLabel = document.getElementById('season-label');

            try {
                grid.classList.add('hidden');
                loader.classList.remove('hidden');
                errorMsg.classList.add('hidden');

                isSearchMode = false;
                const searchBarContainer = document.getElementById('search-bar-container');
                if (searchBarContainer) searchBarContainer.classList.add('hidden');
                const searchInput = document.getElementById('search-input');
                if (searchInput) searchInput.value = '';
                const clearBtn = document.getElementById('search-clear-btn');
                if (clearBtn) clearBtn.classList.add('hidden');

                if (activeDay === 'search') {
                    const todayIndex = new Date().getDay();
                    activeDay = daysMap[todayIndex];
                }

                updateTabStyles();

                const { year, season, label } = getSelectedSeasonInfo();
                if (seasonLabel) {
                    seasonLabel.textContent = label;
                }

                const query = `
                    query($season: MediaSeason, $seasonYear: Int) {
                        Page(page: 1, perPage: 50) {
                            media(season: $season, seasonYear: $seasonYear, type: ANIME, sort: POPULARITY_DESC) {
                                id
                                title {
                                    romaji
                                    english
                                    native
                                }
                                coverImage {
                                    large
                                }
                                startDate {
                                    year
                                    month
                                    day
                                }
                                format
                                status
                                episodes
                                duration
                                season
                                seasonYear
                                studios(isMain: true) {
                                    nodes {
                                        name
                                        isAnimationStudio
                                    }
                                }
                                staff {
                                    edges {
                                        role
                                        node {
                                            name {
                                                full
                                                native
                                            }
                                        }
                                    }
                                }
                                externalLinks {
                                    site
                                    url
                                    type
                                }
                                characters(role: MAIN, sort: [ROLE]) {
                                    edges {
                                        node {
                                            name {
                                                full
                                                native
                                            }
                                        }
                                        voiceActors(language: JAPANESE) {
                                            name {
                                                full
                                                native
                                            }
                                        }
                                    }
                                }
                            }
                        }
                    }
                `;

                const res = await fetch('https://graphql.anilist.co', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json',
                    },
                    body: JSON.stringify({
                        query: query,
                        variables: { season, seasonYear: year }
                    })
                });

                if (!res.ok) {
                    throw new Error('AniList API response error');
                }

                const result = await res.json();
                if (result.errors) {
                    throw new Error(result.errors[0].message);
                }

                const aniListMedia = result.data.Page.media;
                allAnimeList = aniListMedia.map(mapAniListMediaToAnime);

                isLoadComplete = true;
                loader.classList.add('hidden');
                grid.classList.remove('hidden');
                renderAnimeByDay(activeDay);

            } catch (error) {
                console.error('Error loading anime data:', error);
                loader.classList.add('hidden');
                errorMsg.innerHTML = `
                    <div class="max-w-md mx-auto p-8 bg-white/[0.03] backdrop-blur-xl rounded-3xl border border-red-500/20 shadow-2xl">
                        <div class="w-12 h-12 mx-auto mb-4 rounded-2xl bg-red-500/10 border border-red-500/20 flex items-center justify-center text-red-400">
                            <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                            </svg>
                        </div>
                        <h3 class="text-base font-bold text-white mb-2">データの取得に失敗しました</h3>
                        <p class="text-xs text-slate-400 mb-6 leading-relaxed">
                            接続エラー、またはAPIサーバーの一時的な障害の可能性があります。<br>しばらく待ってから再読み込みをお試しください。
                        </p>
                        <button onclick="loadAllAnimeData()" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold rounded-xl shadow-md transition-all">
                            再試行する
                        </button>
                    </div>
                `;
                errorMsg.classList.remove('hidden');
            }
        }

        // AniList から過去作品を含めてグローバル検索する関数

            const grid = document.getElementById('anime-grid');

                if (seasonLabel) {
                    seasonLabel.textContent = `検索: "${queryText}"`;
                }

                updateTabStyles();

                const query = `
                    query($search: String) {
                        Page(page: 1, perPage: 50) {
                            media(search: $search, type: ANIME, sort: POPULARITY_DESC) {
                                id
                                title {
                                    romaji
                                    english
                                    native
                                }
                                coverImage {
                                    large
                                }
                                startDate {
                                    year
                                    month
                                    day
                                }
                                format

                                episodes
                                duration
                                season

                                    }
                                }
                                staff {
                                    edges {
                                        role
                                        node {
                                            name {
                                                full
                                                native
                                            }
                                        }
                                    }
                                }
                                externalLinks {
                                    site
                                    url
                                    type
                                }
                                characters(role: MAIN, sort: [ROLE]) {
                                    edges {
                                        node {
                                            name {
                                                full
                                                native
                                            }
                                        }
                                        voiceActors(language: JAPANESE) {
                                            name {
                                                full
                                                native
                                            }
                                        }
                                    }
                                }
                            }
                        }
                    }
                `;

                const res = await fetch('https://graphql.anilist.co', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json',
                    },
                    body: JSON.stringify({
                        query: query,
                        variables: { search: queryText }
                    })
                });

                if (!res.ok) {
                    throw new Error('AniList API response error');
                }

                const result = await res.json();
                if (result.errors) {
                    throw new Error(result.errors[0].message);
                }

                const aniListMedia = result.data.Page.media;
                searchResultsList = aniListMedia.map(mapAniListMediaToAnime);

                isSearchMode = true;

        // 曜日ごとにアニメをフィルタしてグリッドに描画する関数
        function renderAnimeByDay(day) {
            const grid = document.getElementById('anime-grid');
            
            let filtered = [];

            if (day === 'selected') {
                let migrated = false;
                selectedAnimeIds.forEach(id => {
                    if (!selectedAnimeList.some(a => a.id === id)) {
                        const found = allAnimeList.find(a => a.id === id) || searchResultsList.find(a => a.id === id);
                        if (found) {
                            selectedAnimeList.push(found);
                            migrated = true;
                        }
                    }
                });
                if (migrated) {
                    saveSelectedAnime();
                }
                filtered = selectedAnimeList;
            } else if (isSearchMode) {
                filtered = searchResultsList;
            } else if (day === 'all') {
                filtered = allAnimeList;
            } else {
                filtered = allAnimeList.filter(anime => {
                    let animeDay = 'other';
                    if (anime.releasedOn) {
                        const date = new Date(anime.releasedOn);
                        if (!isNaN(date.getTime())) {
                            const dayIndex = date.getDay();
                            animeDay = daysMap[dayIndex];
                        }
                    }
                    if (day === 'other') {
                        return animeDay === 'other';
                    }
                    return animeDay === day;
                });

                    grid.innerHTML = `

                            </button>
                            ${imgHtml}
                            <div class="absolute inset-0 bg-gradient-to-t from-black/95 via-black/40 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex flex-col justify-end p-2.5 pointer-events-none z-10">
                                <span class="text-white text-xs font-bold line-clamp-2 leading-snug mb-1">${escapeHtml(anime.title)}</span>
                                <span class="text-[10px] text-blue-400 font-medium">${escapeHtml(anime.studioName)}</span>
                            </div>
                        </div>
                    `;
                }

                // 基本情報
                const isMovie = anime.formatLabel === '劇場アニメ' || anime.media === 'MOVIE';
                const isOna = anime.formatLabel === 'Web配信' || anime.media === 'ONA';
                const seasonLabelName = isMovie ? '公開時期:' : (isOna ? '配信時期:' : '放送期:');
                const startLabelName = isMovie ? '公開日:' : (isOna ? '配信開始:' : '開始日:');
                const durationLabelName = isMovie ? '上映時間:' : '話数 / 尺:';
                const durationVal = isMovie 
                    ? (anime.durationLabel ? escapeHtml(anime.durationLabel) : (anime.episodesLabel && anime.episodesLabel !== '話数未定' ? escapeHtml(anime.episodesLabel) : '上映時間未定'))
                    : `${escapeHtml(anime.episodesLabel)}${anime.durationLabel ? ` (${escapeHtml(anime.durationLabel)})` : ''}`;

                const infoHtml = `
                    <div class="text-[10px] sm:text-[11px] text-slate-400 space-y-1 sm:space-y-1.5 pt-2.5 sm:pt-3 border-t border-white/[0.06] font-medium">
                        <div class="flex justify-between items-center">
                            <span class="text-slate-500">${seasonLabelName}</span>
                            <span class="text-slate-200 font-semibold">${escapeHtml(anime.seasonLabelVal || '今期')}</span>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-slate-500">${startLabelName}</span>
                            <span class="text-slate-300">${escapeHtml(anime.startDateLabel)}</span>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-slate-500">${durationLabelName}</span>
                            <span class="text-slate-300 truncate ml-1">${durationVal}</span>
                        </div>
                        <div class="flex justify-between items-center truncate">
                            <span class="text-slate-500 mr-1.5 shrink-0">制作:</span>
                            <span class="text-slate-300 truncate font-medium" title="${escapeHtml(anime.studioName)}">${escapeHtml(anime.studioName)}</span>
                        </div>
                    </div>
                `;

                // スタッフ情報
                const staffList = [];
                if (anime.originalCreators.length > 0) {
                    staffList.push(`<div><span class="text-slate-500 mr-1">原作:</span><span class="text-slate-300">${escapeHtml(anime.originalCreators.slice(0, 2).join('、'))}</span></div>`);
                }
                if (anime.directors.length > 0) {
                    staffList.push(`<div><span class="text-slate-500 mr-1">監督:</span><span class="text-slate-300">${escapeHtml(anime.directors.slice(0, 2).join('、'))}</span></div>`);
                }
                if (anime.scriptwriters.length > 0) {
                    staffList.push(`<div><span class="text-slate-500 mr-1">構成:</span><span class="text-slate-300">${escapeHtml(anime.scriptwriters.slice(0, 2).join('、'))}</span></div>`);
                }
                if (anime.composers.length > 0) {
                    staffList.push(`<div><span class="text-slate-500 mr-1">音楽:</span><span class="text-slate-300">${escapeHtml(anime.composers.slice(0, 2).join('、'))}</span></div>`);
                }

                const staffHtml = staffList.length > 0
                    ? `
                    <div class="text-[10px] sm:text-[11px] text-slate-400 space-y-0.5 sm:space-y-1 pt-2 sm:pt-2.5 border-t border-white/[0.06] font-medium">
                        ${staffList.join('')}
                    </div>
                    `
                    : '';

                // キャスト（声優）
                const castHtml = anime.casts.length > 0
                    ? `
                    <div class="text-[10px] text-slate-400 border-t border-white/[0.06] pt-2 sm:pt-2.5 mt-2 sm:mt-2.5">
                        <span class="text-slate-400 font-semibold block mb-1 text-[10px] sm:text-[11px]">主要キャスト</span>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-2 gap-y-0.5 sm:gap-y-1 text-slate-300 max-h-[64px] sm:max-h-[76px] overflow-y-auto pr-1">
                            ${anime.casts.map(c => `
                                <div class="truncate flex items-center gap-1" title="${escapeHtml(c.character)}: ${escapeHtml(c.actor)}">
                                    <span class="w-1 h-1 rounded-full bg-blue-400/60 shrink-0"></span>
                                    <span class="font-medium text-[9px] sm:text-[10px]">${escapeHtml(c.actor)}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    `
                    : '';

                // 配信・リンクバッジ
                const links = anime.streamingLinks;
                const hasLinks = (links.dAnimeStore || links.unext || links.amazon || links.netflix || links.abema || links.dmm || links.nico || anime.officialSite);
                const streamingHtml = hasLinks
                    ? `
                    <div class="border-t border-white/[0.06] pt-2.5 sm:pt-3 mt-2.5 sm:mt-3">
                        <div class="flex flex-wrap items-center gap-1 sm:gap-1.5">
                            ${anime.officialSite ? `<a href="${anime.officialSite}" target="_blank" class="text-[9px] sm:text-[10px] bg-white/[0.06] hover:bg-white/[0.12] text-slate-200 px-1.5 sm:px-2 py-0.5 rounded-md border border-white/[0.1] transition-all font-semibold flex items-center gap-1">🌐 公式</a>` : ''}
                            ${links.dAnimeStore ? `<a href="${links.dAnimeStore}" target="_blank" class="text-[9px] sm:text-[10px] bg-orange-500/10 hover:bg-orange-500/20 text-orange-300 px-1.5 sm:px-2 py-0.5 rounded-md border border-orange-500/20 transition-all font-medium">dアニメ</a>` : ''}
                            ${links.unext ? `<a href="${links.unext}" target="_blank" class="text-[9px] sm:text-[10px] bg-blue-500/10 hover:bg-blue-500/20 text-blue-300 px-1.5 sm:px-2 py-0.5 rounded-md border border-blue-500/20 transition-all font-medium">U-NEXT</a>` : ''}
                            ${links.amazon ? `<a href="${links.amazon}" target="_blank" class="text-[9px] sm:text-[10px] bg-amber-500/10 hover:bg-amber-500/20 text-amber-300 px-1.5 sm:px-2 py-0.5 rounded-md border border-amber-500/20 transition-all font-medium">Prime</a>` : ''}
                            ${links.netflix ? `<a href="${links.netflix}" target="_blank" class="text-[9px] sm:text-[10px] bg-red-500/10 hover:bg-red-500/20 text-red-300 px-1.5 sm:px-2 py-0.5 rounded-md border border-red-500/20 transition-all font-medium">Netflix</a>` : ''}
                            ${links.abema ? `<a href="${links.abema}" target="_blank" class="text-[9px] sm:text-[10px] bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-300 px-1.5 sm:px-2 py-0.5 rounded-md border border-emerald-500/20 transition-all font-medium">ABEMA</a>` : ''}
                            ${links.dmm ? `<a href="${links.dmm}" target="_blank" class="text-[9px] sm:text-[10px] bg-slate-500/10 hover:bg-slate-500/20 text-slate-300 px-1.5 sm:px-2 py-0.5 rounded-md border border-slate-500/20 transition-all font-medium">DMM</a>` : ''}
                        </div>
                    </div>
                    `
                    : '';

                // ステータスとメディアバッジ
                const mediaTag = `<span class="text-[9px] sm:text-[10px] font-bold tracking-wider px-1.5 sm:px-2 py-0.5 rounded bg-blue-500/15 text-blue-400 border border-blue-500/25">${escapeHtml(anime.formatLabel)}</span>`;
                const statusTag = `<span class="text-[9px] sm:text-[10px] font-medium tracking-wide px-1.5 sm:px-2 py-0.5 rounded bg-white/[0.05] text-slate-400 border border-white/[0.08]">${escapeHtml(anime.statusLabel)}</span>`;

                return `
                    <div class="anime-card group relative bg-[#0e1017] rounded-xl sm:rounded-2xl overflow-hidden border ${selectedBorder} flex flex-col h-full shadow-lg" data-id="${anime.id}">
                        
                        <!-- お気に入りボタン -->
                        <button class="select-btn absolute top-2 right-2 sm:top-3 sm:right-3 w-7 h-7 sm:w-8 sm:h-8 rounded-full ${btnState} flex items-center justify-center transition-all z-20 shadow-md" data-id="${anime.id}" title="お気に入り登録">
                            <svg class="w-3.5 h-3.5 sm:w-4 sm:h-4 fill-current" viewBox="0 0 20 20">
                                <path d="M0 11l2-2 5 5L18 3l2 2L7 18z"/>
                            </svg>
                        </button>

                        <!-- カバーアート -->
                        <div class="relative aspect-[3/4] overflow-hidden bg-slate-900 shrink-0">
                            ${imgHtml}
                            <div class="absolute inset-0 bg-gradient-to-t from-[#0e1017] via-transparent to-transparent opacity-80 pointer-events-none"></div>
                        </div>

                        <!-- コンテンツ本体 -->
                        <div class="p-2.5 sm:p-4 flex-grow flex flex-col justify-between -mt-4 sm:-mt-6 relative z-10">
                            <div>
                                <div class="flex items-center gap-1 sm:gap-1.5 mb-1.5 sm:mb-2">
                                    ${mediaTag}
                                    ${statusTag}
                                </div>
                                <h2 class="font-bold text-xs sm:text-base leading-snug text-white group-hover:text-blue-400 transition-colors line-clamp-2 mb-1" title="${escapeHtml(anime.title)}">
                                    ${escapeHtml(anime.title)}
                                </h2>
                                ${infoHtml}
                                ${staffHtml}
                                ${castHtml}
                            </div>
                            <div class="mt-auto">
                                ${streamingHtml}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, tag => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                "'": '&#39;',
                '"': '&quot;'
            }[tag] || tag));
        }

        // タブクリック時の曜日切り替え処理
        function setupDayTabs() {
            const tabs = document.querySelectorAll('.day-tab-btn');
            const searchBarContainer = document.getElementById('search-bar-container');
            const searchInput = document.getElementById('search-input');
            const clearBtn = document.getElementById('search-clear-btn');
            const seasonLabel = document.getElementById('season-label');

            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    const day = tab.getAttribute('data-day');
                    if (day === activeDay && !isSearchMode) return;

                    activeDay = day;

                    if (day === 'search') {
                        isSearchMode = true;
                        if (searchBarContainer) searchBarContainer.classList.remove('hidden');
                        if (seasonLabel) {
                            seasonLabel.textContent = '作品検索';
                        }
                        updateTabStyles();
                        renderAnimeByDay('search');
                        setTimeout(() => searchInput?.focus(), 50);
                    } else {
                        isSearchMode = false;
                        if (searchBarContainer) searchBarContainer.classList.add('hidden');
                        if (searchInput) searchInput.value = '';
                        if (clearBtn) clearBtn.classList.add('hidden');

                        const currentSeason = getSelectedSeasonInfo();
                        if (seasonLabel) {
                            seasonLabel.textContent = currentSeason.label;
                        }

                        updateTabStyles();
                        renderAnimeByDay(activeDay);
                    }
                });
            });
        }

        // グリッド内クリックイベント（選択ボタンのトグル処理）
        function setupGridEvents() {
            document.getElementById('anime-grid').addEventListener('click', (e) => {
                const btn = e.target.closest('.select-btn');
                if (btn) {
                    e.preventDefault();
                    e.stopPropagation();
                    
                    const malId = parseInt(btn.getAttribute('data-id'), 10);
                    
                    let animeObj = allAnimeList.find(a => a.id === malId);
                    if (!animeObj && isSearchMode) {
                        animeObj = searchResultsList.find(a => a.id === malId);
                    }
                    if (!animeObj) {
                        animeObj = selectedAnimeList.find(a => a.id === malId);
                    }

                    if (animeObj) {
                        toggleSelectAnime(animeObj);
                    } else {
                        if (selectedAnimeIds.has(malId)) {
                            selectedAnimeIds.delete(malId);
                        } else {
                            selectedAnimeIds.add(malId);
                        }
                        saveSelectedAnime();
                    }

                    if (activeDay === 'selected') {
                        renderAnimeByDay('selected');
                    } else {
                        const card = btn.closest('.anime-card') || btn.closest('.anime-tile');
                        const isNowSelected = selectedAnimeIds.has(malId);
                        
                        if (card) {
                            if (card.classList.contains('anime-card')) {
                                if (isNowSelected) {
                                    card.classList.add('is-selected', 'border-blue-500/80', 'shadow-lg', 'shadow-blue-500/15');
                                    card.classList.remove('border-white/[0.08]');
                                    btn.className = 'select-btn absolute top-2 right-2 sm:top-3 sm:right-3 w-7 h-7 sm:w-8 sm:h-8 rounded-full bg-blue-600 text-white shadow-md shadow-blue-500/40 border border-blue-400 flex items-center justify-center transition-all z-20';
                                } else {
                                    card.classList.remove('is-selected', 'border-blue-500/80', 'shadow-lg', 'shadow-blue-500/15');
                                    card.classList.add('border-white/[0.08]');
                                    btn.className = 'select-btn absolute top-2 right-2 sm:top-3 sm:right-3 w-7 h-7 sm:w-8 sm:h-8 rounded-full bg-black/50 text-slate-300 hover:text-white hover:bg-black/80 border border-white/20 backdrop-blur-md flex items-center justify-center transition-all z-20';
                                }
                            } else if (card.classList.contains('anime-tile')) {
                                if (isNowSelected) {
                                    card.className = 'anime-tile group relative aspect-[3/4] rounded-xl overflow-hidden bg-[#0d0f18] cursor-pointer ring-2 ring-blue-500 shadow-lg shadow-blue-500/30';
                                    btn.className = 'select-btn absolute top-2 right-2 w-7 h-7 rounded-full bg-blue-600 text-white shadow-md shadow-blue-500/40 border border-blue-400 flex items-center justify-center transition-all z-20 opacity-100';
                                } else {
                                    card.className = 'anime-tile group relative aspect-[3/4] rounded-xl overflow-hidden bg-[#0d0f18] cursor-pointer ring-1 ring-white/10';
                                    btn.className = 'select-btn absolute top-2 right-2 w-7 h-7 rounded-full bg-black/50 text-slate-300 hover:text-white hover:bg-black/80 border border-white/20 backdrop-blur-md flex items-center justify-center transition-all z-20 opacity-0 group-hover:opacity-100';
                                }
                            }
                        }
                    }
                }
            });
        }

        // 検索窓に関連するイベントリスナーの設定
        function setupSearchEvents() {
            const searchInput = document.getElementById('search-input');
            const searchBtn = document.getElementById('search-btn');
            const clearBtn = document.getElementById('search-clear-btn');

            if (!searchInput || !searchBtn || !clearBtn) return;

            searchInput.addEventListener('input', () => {
                if (searchInput.value.trim()) {
                    clearBtn.classList.remove('hidden');
                } else {
                    clearBtn.classList.add('hidden');
                }
            });

            searchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    searchAnime(searchInput.value.trim());
                }
            });

            searchBtn.addEventListener('click', () => {
                searchAnime(searchInput.value.trim());
            });

            clearBtn.addEventListener('click', () => {
                searchInput.value = '';
                clearBtn.classList.add('hidden');
                searchResultsList = [];
                renderAnimeByDay('search');
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateTabStyles();
            populateSelectors();
            
            const yearSelect = document.getElementById('year-select');
            const seasonSelect = document.getElementById('season-select');
            
            yearSelect.addEventListener('change', () => loadAllAnimeData());
            seasonSelect.addEventListener('change', () => loadAllAnimeData());

            function setupViewToggle() {
                const toggleBtn = document.getElementById('view-toggle-btn');
                if (!toggleBtn) return;
                
                toggleBtn.addEventListener('click', () => {
                    isTileView = !isTileView;
                    const grid = document.getElementById('anime-grid');
                    const isHidden = grid.classList.contains('hidden');
                    
                    if (isTileView) {
                        grid.className = 'grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-6 xl:grid-cols-8 gap-2 sm:gap-3';
                        toggleBtn.className = 'p-2.5 rounded-xl bg-blue-600 text-white border border-blue-400 shadow-md shadow-blue-500/25 transition-all flex items-center gap-2 text-xs font-semibold';
                    } else {
                        grid.className = 'grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-3 sm:gap-6';
                        toggleBtn.className = 'p-2.5 rounded-xl bg-white/[0.04] hover:bg-white/[0.08] text-slate-400 hover:text-white border border-white/[0.08] transition-all flex items-center gap-2 text-xs font-semibold';
                    }
                    
                    if (isHidden) grid.classList.add('hidden');
                    renderAnimeByDay(activeDay);
                });
            }

            setupDayTabs();
            setupGridEvents();
            setupSearchEvents();
            setupViewToggle();
            loadAllAnimeData();
            updateFavBadge();
        });
    </script>
</body>

</html>
