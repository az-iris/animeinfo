<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今期のアニメ - Anime App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto+Sans+JP', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }

        .anime-card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .anime-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
        }

        .loader {
            border-top-color: #3b82f6;
            animation: spinner 1.5s linear infinite;
        }

        @keyframes spinner {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body class="min-h-screen">
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-10">
        <div class="container mx-auto px-4 py-6 flex justify-between items-center">
            <h1 class="text-3xl font-bold bg-gradient-to-r from-blue-400 to-emerald-400 bg-clip-text text-transparent">
                今期のアニメ
            </h1>
            <button id="annict-btn" class="bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white px-4 py-2 rounded-lg text-sm font-semibold border border-slate-700 transition-colors flex items-center gap-2">
                <span>🔑</span> Annict連携
            </button>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8">
        <!-- 曜日選択タブ -->
        <div id="day-tabs" class="flex flex-wrap justify-center gap-2 mb-8">
            <button class="day-tab-btn px-4 py-2 rounded-lg text-sm font-semibold transition-colors bg-slate-800 text-slate-300 hover:bg-slate-700 hover:text-white" data-day="monday">月曜日</button>
            <button class="day-tab-btn px-4 py-2 rounded-lg text-sm font-semibold transition-colors bg-slate-800 text-slate-300 hover:bg-slate-700 hover:text-white" data-day="tuesday">火曜日</button>
            <button class="day-tab-btn px-4 py-2 rounded-lg text-sm font-semibold transition-colors bg-slate-800 text-slate-300 hover:bg-slate-700 hover:text-white" data-day="wednesday">水曜日</button>
            <button class="day-tab-btn px-4 py-2 rounded-lg text-sm font-semibold transition-colors bg-slate-800 text-slate-300 hover:bg-slate-700 hover:text-white" data-day="thursday">木曜日</button>
            <button class="day-tab-btn px-4 py-2 rounded-lg text-sm font-semibold transition-colors bg-slate-800 text-slate-300 hover:bg-slate-700 hover:text-white" data-day="friday">金曜日</button>
            <button class="day-tab-btn px-4 py-2 rounded-lg text-sm font-semibold transition-colors bg-slate-800 text-slate-300 hover:bg-slate-700 hover:text-white" data-day="saturday">土曜日</button>
            <button class="day-tab-btn px-4 py-2 rounded-lg text-sm font-semibold transition-colors bg-slate-800 text-slate-300 hover:bg-slate-700 hover:text-white" data-day="sunday">日曜日</button>
            <button class="day-tab-btn px-4 py-2 rounded-lg text-sm font-semibold transition-colors bg-slate-800 text-slate-300 hover:bg-slate-700 hover:text-white" data-day="other">その他</button>
            <button class="day-tab-btn px-4 py-2 rounded-lg text-sm font-semibold transition-colors bg-slate-800 text-slate-300 hover:bg-slate-700 hover:text-white" data-day="selected">📌 選択中</button>
        </div>

        <div id="loader-container" class="flex flex-col items-center justify-center py-20">
            <div class="loader ease-linear rounded-full border-4 border-t-4 border-slate-700 h-12 w-12 mb-4"></div>
            <p class="text-slate-400">データを読み込み中...</p>
        </div>

        <div id="anime-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6 hidden">
            <!-- アニメカードがここに挿入されます -->
        </div>



        <div id="error-message" class="hidden text-center py-20">
            <p class="text-red-400 text-lg">データの取得に失敗しました。後でもう一度お試しください。</p>
        </div>
    </main>

    <!-- Annictトークン設定モーダル -->
    <div id="annict-modal" class="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 flex items-center justify-center hidden">
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 w-full max-w-md mx-4 shadow-2xl">
            <h2 class="text-lg font-bold text-slate-200 mb-4 flex items-center gap-2">
                <span>🔑</span> Annictアクセストークン設定
            </h2>
            <p class="text-xs text-slate-400 mb-4 leading-relaxed">
                キャスト（声優）情報を取得するために、Annictの個人用アクセストークンが必要です。<br>
                アニクトにログインした状態で <a href="https://annict.com/settings/apps" target="_blank" class="text-blue-400 hover:underline">Annict個人用アプリ設定ページ</a> から「新規個人用アクセストークン」を「読み込み専用 (read)」で発行し、ここに貼り付けてください。
            </p>
            <div class="mb-4">
                <input 
                    type="password" 
                    id="annict-token-input" 
                    placeholder="アクセストークンを入力..." 
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-blue-500"
                >
            </div>
            <div class="flex justify-end gap-3">
                <button id="annict-cancel-btn" class="px-4 py-2 text-sm text-slate-400 hover:text-slate-200 font-semibold transition-colors">
                    キャンセル
                </button>
                <button id="annict-save-btn" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-sm font-semibold transition-colors">
                    保存する
                </button>
            </div>
        </div>
    </div>

    <footer class="bg-slate-900 border-t border-slate-800 mt-12 py-8">
        <div class="container mx-auto px-4 text-center text-slate-500 text-sm">
            <p>Data provided by Annict & Shangri-La API</p>
        </div>
    </footer>

    <script>
        let allAnimeList = [];
        let activeDay = 'monday';
        let isLoadComplete = false;
        
        // 選択されたアニメIDを保存するSet
        const selectedAnimeIds = new Set(JSON.parse(localStorage.getItem('selected_anime_ids') || '[]'));

        const daysMap = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
        
        // 今日の曜日を取得
        const todayIndex = new Date().getDay();
        activeDay = daysMap[todayIndex];

        // 日付から今期のクール・シーズン名を自動算出する関数
        function getSeasonInfo() {
            const date = new Date();
            const year = date.getFullYear();
            const month = date.getMonth() + 1; // 1-12
            let seasonName = 'spring';
            let cours = 1;
            
            if (month >= 1 && month <= 3) {
                seasonName = 'winter';
                cours = 1;
            } else if (month >= 4 && month <= 6) {
                seasonName = 'spring';
                cours = 2;
            } else if (month >= 7 && month <= 9) {
                seasonName = 'summer';
                cours = 3;
            } else if (month >= 10 && month <= 12) {
                seasonName = 'autumn';
                cours = 4;
            }
            
            return {
                year: year,
                cours: cours,
                seasonParam: `${year}-${seasonName}`
            };
        }

        // Annict GraphQL + Shangri-La からデータを一括取得する関数
        async function loadAllAnimeData() {
            const grid = document.getElementById('anime-grid');
            const loader = document.getElementById('loader-container');
            const errorMsg = document.getElementById('error-message');

            const token = localStorage.getItem('annict_token');
            if (!token || token.trim() === '') {
                loader.classList.add('hidden');
                errorMsg.innerHTML = `
                    <div class="max-w-md mx-auto p-6 bg-slate-800 rounded-xl border border-slate-700 shadow-xl">
                        <p class="text-amber-500 font-bold mb-4">🔑 Annictのアクセストークンが設定されていません</p>
                        <p class="text-sm text-slate-400 mb-6 leading-relaxed">
                            キャスト情報やアニメ情報を取得するためにAnnict連携が必要です。<br>
                            右上の「🔑 Annict連携」ボタンからアクセストークンを保存してください。
                        </p>
                        <button onclick="document.getElementById('annict-modal').classList.remove('hidden')" class="bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2 px-6 rounded-lg text-sm transition-colors shadow-lg">
                            アクセストークンを設定する
                        </button>
                    </div>
                `;
                errorMsg.classList.remove('hidden');
                return;
            }

            try {
                grid.classList.add('hidden');
                loader.classList.remove('hidden');
                errorMsg.classList.add('hidden');

                const { year, cours, seasonParam } = getSeasonInfo();

                // 1. Annict GraphQL API からデータ取得
                const query = `
                    query($season: String!) {
                        searchWorks(seasons: [$season], orderBy: { field: WATCHERS_COUNT, direction: DESC }, first: 100) {
                            nodes {
                                annictId
                                title
                                titleKana
                                media
                                releasedOn
                                image {
                                    recommendedImageUrl
                                }
                                casts(orderBy: { field: SORT_NUMBER, direction: ASC }) {
                                    nodes {
                                        character {
                                            name
                                        }
                                        person {
                                            name
                                        }
                                    }
                                }
                            }
                        }
                    }
                `;

                const annictPromise = fetch('https://api.annict.com/graphql', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        query: query,
                        variables: { season: seasonParam }
                    })
                }).then(res => {
                    if (!res.ok) throw new Error('Annict API response error');
                    return res.json();
                });

                // 2. Shangri-La API から配信サービス一覧取得
                const shangriLaPromise = fetch(`https://anime-api.xyz/api/v1/master/${year}/${cours}`)
                    .then(res => {
                        if (!res.ok) throw new Error('Shangri-La API response error');
                        return res.json();
                    });

                // 並行フェッチ
                const [annictResult, shangriLaResult] = await Promise.all([annictPromise, shangriLaPromise]);

                if (annictResult.errors) {
                    throw new Error(annictResult.errors[0].message);
                }

                const annictWorks = annictResult.data.searchWorks.nodes;

                // 3. マッピング (アニクトのWork ＋ シャングリラの配信リンク)
                allAnimeList = annictWorks.map(work => {
                    // タイトルの正規化比較（スペースや記号、全角半角の違いなどを無視）
                    const normalizeText = (t) => (t || '').toLowerCase().replace(/[\s\s　\-\:\!\?\/]/g, '');
                    const cleanAnnictTitle = normalizeText(work.title);
                    
                    const matchedStreaming = shangriLaResult.find(item => {
                        const cleanSgTitle = normalizeText(item.title);
                        return cleanAnnictTitle === cleanSgTitle || 
                               cleanSgTitle.includes(cleanAnnictTitle) || 
                               cleanAnnictTitle.includes(cleanSgTitle);
                    }) || {};

                    return {
                        id: work.annictId,
                        title: work.title,
                        titleKana: work.titleKana,
                        media: work.media,
                        releasedOn: work.releasedOn,
                        imageUrl: work.image ? work.image.recommendedImageUrl : '',
                        casts: work.casts.nodes.map(c => ({
                            character: c.character ? c.character.name : '',
                            actor: c.person ? c.person.name : ''
                        })).filter(c => c.character && c.actor).slice(0, 4), // 主要4名
                        streamingLinks: {
                            dAnimeStore: matchedStreaming.dAnimeStore || '',
                            unext: matchedStreaming.unext || '',
                            amazon: matchedStreaming.amazon || '',
                            netflix: matchedStreaming.netflix || '',
                            abema: matchedStreaming.abema || '',
                            dmm: matchedStreaming.dmm || '',
                            nico: matchedStreaming.nico || ''
                        }
                    };
                });

                isLoadComplete = true;
                loader.classList.add('hidden');
                grid.classList.remove('hidden');
                renderAnimeByDay(activeDay);

            } catch (error) {
                console.error('Error loading hybrid anime data:', error);
                loader.classList.add('hidden');
                errorMsg.innerHTML = `
                    <div class="max-w-md mx-auto p-6 bg-slate-800 rounded-xl border border-slate-700 shadow-xl">
                        <p class="text-red-400 font-bold mb-4">データの取得に失敗しました</p>
                        <p class="text-xs text-slate-400 mb-6 leading-relaxed">
                            接続エラー、またはアクセストークンが正しくない可能性があります。<br>
                            右上の「🔑 Annict連携」ボタンからキーを再設定し、時間をおいて再読込してください。
                        </p>
                        <p class="text-[10px] text-slate-500 bg-slate-900/50 p-2 rounded border border-slate-800 text-left">
                            エラー詳細: ${escapeHtml(error.message || String(error))}
                        </p>
                    </div>
                `;
                errorMsg.classList.remove('hidden');
            }
        }

        // 曜日ごとにアニメをフィルタしてグリッドに描画する関数
        function renderAnimeByDay(day) {
            const grid = document.getElementById('anime-grid');
            
            const filtered = allAnimeList.filter(anime => {
                if (day === 'selected') {
                    return selectedAnimeIds.has(anime.id);
                }

                // 放送開始日（releasedOn）から曜日を算出
                let animeDay = 'other';
                if (anime.releasedOn) {
                    const date = new Date(anime.releasedOn);
                    if (!isNaN(date.getTime())) {
                        const dayIndex = date.getDay(); // 0:日, 1:月...
                        animeDay = daysMap[dayIndex];
                    }
                }
                
                if (day === 'other') {
                    return animeDay === 'other';
                }
                return animeDay === day;
            });

            if (filtered.length === 0) {
                if (day === 'selected') {
                    grid.innerHTML = `
                        <div class="col-span-full text-center py-20 text-slate-500">
                            <p class="text-sm">選択されたアニメはありません。</p>
                            <p class="text-xs text-slate-600 mt-2">気になるアニメの右上にある ✓ をクリックして選択してください。</p>
                        </div>
                    `;
                } else {
                    grid.innerHTML = `
                        <div class="col-span-full text-center py-20 text-slate-500">
                            <p class="text-sm">この曜日に放送されるアニメはありません。</p>
                        </div>
                    `;
                }
                return;
            }

            grid.innerHTML = filtered.map(anime => {
                const isSelected = selectedAnimeIds.has(anime.id);
                const borderClass = isSelected ? 'border-blue-500' : 'border-transparent';
                const btnClass = isSelected ? 'bg-blue-600 text-white' : 'bg-slate-900/80 text-slate-400 hover:text-white';

                // キャスト表示の生成
                const castHtml = anime.casts.length > 0
                    ? `
                    <div class="text-[10px] text-slate-400 border-t border-slate-700/50 pt-2 mt-2">
                        <strong class="text-slate-300">主要キャスト:</strong>
                        <div class="grid grid-cols-2 gap-1 mt-1 font-semibold text-slate-400">
                            ${anime.casts.map(c => `
                                <div class="truncate" title="${escapeHtml(c.character)}: ${escapeHtml(c.actor)}">
                                    • ${escapeHtml(c.actor)} <span class="text-[9px] text-slate-500">(${escapeHtml(c.character)})</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    `
                    : '';

                // 配信サービスのバッジ生成
                const links = anime.streamingLinks;
                const streamingHtml = (links.dAnimeStore || links.unext || links.amazon || links.netflix || links.abema || links.dmm || links.nico)
                    ? `
                    <div class="text-[10px] text-slate-400 border-t border-slate-700/50 pt-2 mt-2">
                        <strong class="text-slate-300 block mb-1">配信サイト:</strong>
                        <div class="flex flex-wrap gap-1">
                            ${links.dAnimeStore ? `<a href="${links.dAnimeStore}" target="_blank" class="text-[9px] bg-red-950/60 hover:bg-red-900/80 text-red-300 px-1.5 py-0.5 rounded border border-red-900/50 transition-colors">dアニメ</a>` : ''}
                            ${links.unext ? `<a href="${links.unext}" target="_blank" class="text-[9px] bg-blue-950/60 hover:bg-blue-900/80 text-blue-300 px-1.5 py-0.5 rounded border border-blue-900/50 transition-colors">U-NEXT</a>` : ''}
                            ${links.amazon ? `<a href="${links.amazon}" target="_blank" class="text-[9px] bg-yellow-950/60 hover:bg-yellow-900/80 text-yellow-300 px-1.5 py-0.5 rounded border border-yellow-900/50 transition-colors">Prime</a>` : ''}
                            ${links.netflix ? `<a href="${links.netflix}" target="_blank" class="text-[9px] bg-red-950/60 hover:bg-red-900/80 text-red-400 px-1.5 py-0.5 rounded border border-red-900/50 transition-colors">Netflix</a>` : ''}
                            ${links.abema ? `<a href="${links.abema}" target="_blank" class="text-[9px] bg-emerald-950/60 hover:bg-emerald-900/80 text-emerald-300 px-1.5 py-0.5 rounded border border-emerald-900/50 transition-colors">ABEMA</a>` : ''}
                            ${links.dmm ? `<a href="${links.dmm}" target="_blank" class="text-[9px] bg-slate-900 hover:bg-slate-700 text-slate-300 px-1.5 py-0.5 rounded border border-slate-700/50 transition-colors">DMM TV</a>` : ''}
                        </div>
                    </div>
                    `
                    : '';

                // 画像プレースホルダー対応
                let imgHtml = '';
                if (anime.imageUrl) {
                    imgHtml = `<img src="${anime.imageUrl}" alt="${anime.title}" class="absolute top-0 left-0 w-full h-full object-cover" loading="lazy">`;
                } else {
                    // 美しいプレースホルダー
                    imgHtml = `
                        <div class="absolute top-0 left-0 w-full h-full bg-gradient-to-br from-slate-700 to-slate-900 flex items-center justify-center p-4 text-center">
                            <span class="text-xs text-slate-400 font-bold line-clamp-3">${escapeHtml(anime.title)}</span>
                        </div>
                    `;
                }

                // 放送形式のフォーマット（media）
                const mediaLabel = anime.media ? `<span class="text-[9px] bg-blue-600/30 text-blue-400 border border-blue-500/20 px-1.5 py-0.5 rounded font-bold">${anime.media.toUpperCase()}</span>` : '';

                return `
                    <div class="anime-card relative bg-slate-800 rounded-xl overflow-hidden shadow-lg flex flex-col h-full border-2 ${borderClass}" data-id="${anime.id}">
                        <!-- 選択ボタン -->
                        <button class="select-btn absolute top-3 right-3 w-8 h-8 rounded-full ${btnClass} flex items-center justify-center transition-colors shadow-md z-10" data-id="${anime.id}">
                            <svg class="w-4 h-4 fill-current" viewBox="0 0 20 20">
                                <path d="M0 11l2-2 5 5L18 3l2 2L7 18z"/>
                            </svg>
                        </button>
                        <div class="relative pt-[140%] overflow-hidden bg-slate-900">
                            ${imgHtml}
                        </div>
                        <div class="p-4 flex-grow flex flex-col justify-between">
                            <div>
                                <div class="flex items-center gap-1.5 mb-1.5">
                                    ${mediaLabel}
                                </div>
                                <h2 class="font-bold text-sm mb-2 line-clamp-2 hover:text-blue-400 transition-colors" title="${escapeHtml(anime.title)}">
                                    ${escapeHtml(anime.title)}
                                </h2>
                                ${castHtml}
                            </div>
                            <div class="mt-auto">
                                ${streamingHtml}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, tag => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                "'": '&#39;',
                '"': '&quot;'
            }[tag] || tag));
        }

        // タブクリック時の曜日切り替え処理
        function setupDayTabs() {
            const tabs = document.querySelectorAll('.day-tab-btn');
            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    const day = tab.getAttribute('data-day');
                    if (day === activeDay) return;

                    activeDay = day;

                    // アクティブスタイルの更新
                    tabs.forEach(t => {
                        t.classList.remove('bg-blue-600', 'text-white');
                        t.classList.add('bg-slate-800', 'text-slate-300');
                    });
                    tab.classList.remove('bg-slate-800', 'text-slate-300');
                    tab.classList.add('bg-blue-600', 'text-white');

                    renderAnimeByDay(activeDay);
                });
            });
        }

        // グリッド内クリックイベント（選択ボタンのトグル処理）
        function setupGridEvents() {
            document.getElementById('anime-grid').addEventListener('click', (e) => {
                const btn = e.target.closest('.select-btn');
                if (btn) {
                    e.preventDefault();
                    e.stopPropagation();
                    
                    const malId = parseInt(btn.getAttribute('data-id'), 10);
                    
                    if (selectedAnimeIds.has(malId)) {
                        selectedAnimeIds.delete(malId);
                    } else {
                        selectedAnimeIds.add(malId);
                    }

                    // localStorage に状態を保存
                    localStorage.setItem('selected_anime_ids', JSON.stringify([...selectedAnimeIds]));

                    if (activeDay === 'selected') {
                        renderAnimeByDay('selected');
                    } else {
                        const card = btn.closest('.anime-card');
                        const isNowSelected = selectedAnimeIds.has(malId);
                        
                        if (isNowSelected) {
                            card.classList.remove('border-transparent');
                            card.classList.add('border-blue-500');
                            btn.classList.remove('bg-slate-900/80', 'text-slate-400', 'hover:text-white');
                            btn.classList.add('bg-blue-600', 'text-white');
                        } else {
                            card.classList.remove('border-blue-500');
                            card.classList.add('border-transparent');
                            btn.classList.remove('bg-blue-600', 'text-white');
                            btn.classList.add('bg-slate-900/80', 'text-slate-400', 'hover:text-white');
                        }
                    }
                }
            });
        }

        // モーダルの制御
        function setupAnnictModal() {
            const modal = document.getElementById('annict-modal');
            const btn = document.getElementById('annict-btn');
            const cancelBtn = document.getElementById('annict-cancel-btn');
            const saveBtn = document.getElementById('annict-save-btn');
            const input = document.getElementById('annict-token-input');

            btn.addEventListener('click', () => {
                input.value = localStorage.getItem('annict_token') || '';
                modal.classList.remove('hidden');
            });

            cancelBtn.addEventListener('click', () => {
                modal.classList.add('hidden');
            });

            saveBtn.addEventListener('click', () => {
                const token = input.value.trim();
                if (token) {
                    localStorage.setItem('annict_token', token);
                } else {
                    localStorage.removeItem('annict_token');
                }
                modal.classList.add('hidden');
                location.reload();
            });

            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    modal.classList.add('hidden');
                }
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            // UIのアクティブスタイルを適用
            const activeTab = document.querySelector(`.day-tab-btn[data-day="${activeDay}"]`);
            if (activeTab) {
                activeTab.classList.remove('bg-slate-800', 'text-slate-300');
                activeTab.classList.add('bg-blue-600', 'text-white');
            }

            setupDayTabs();
            setupGridEvents();
            loadAllAnimeData(1);
        });
    </script>
</body>

</html>
